<section class="contact-section">

    <form
        class="contact-form"
        action="backend/contact.php"
        method="POST"
    >

            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >

        <input
            type="text"
            name="subject"
            placeholder="Subject"
            required
        >

        <textarea
            name="message"
            rows="6"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit" class="btn">
            Send Message
        </button>

    </form>

</section>
